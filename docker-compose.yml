name: stats-prod
services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: ghcr.io/nathkaden/temp-stats-server:latest
    container_name: stats-server
    volumes:
      - ./server-data:/app/data
      - /mnt/backup:/mnt/backup
      - /opt:/opt:ro
      - /usr/share/ollama/.ollama:/usr/share/ollama/.ollama:ro
      - /sys:/sys:ro
      - /proc:/host/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - API_KEY=${API_KEY:-your-secret-key}
      - COLLECTION_INTERVAL_SECONDS=${COLLECTION_INTERVAL_SECONDS:-3600}
      - POWER_BASE_W=${POWER_BASE_W:-5.0}
      - POWER_MAX_W=${POWER_MAX_W:-15.0}
      - MINECRAFT_HOST=${MINECRAFT_HOST:-minecraft-paper}
      - MINECRAFT_PORT=${MINECRAFT_PORT:-25565}
      - MINECRAFT_LOG_PATH=${MINECRAFT_LOG_PATH:-/opt/minecraft/data/logs/latest.log}
    networks:
      - proxy
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.stats-server.rule=Host(`api.stats.beskarfox.com`)"
      - "traefik.http.routers.stats-server.entrypoints=websecure"
      - "traefik.http.routers.stats-server.tls=true"
      - "traefik.http.services.stats-server.loadbalancer.server.port=8000"
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: ghcr.io/nathkaden/temp-stats-client:latest
    container_name: stats-client
    depends_on:
      - server
    environment:
      - HOSTNAME=0.0.0.0
      - BACKEND_API_URL=http://stats-server:8000
    networks:
      - proxy
    restart: always
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.stats-client.rule=Host(`stats.beskarfox.com`)"
      - "traefik.http.routers.stats-client.entrypoints=websecure"
      - "traefik.http.routers.stats-client.tls=true"
      - "traefik.http.services.stats-client.loadbalancer.server.port=3000"
networks:
  proxy:
    external: true