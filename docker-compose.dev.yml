name: stats-staging
services:
  server:
    build: ./server
    container_name: nuc-monitor-server
    hostname: nuc-box
    ports:
      - "8001:8000"
    volumes:
      - ./server:/app
      - ./server/data:/app/data
      - /opt:/opt:ro
      - /usr/share/ollama/.ollama:/usr/share/ollama/.ollama:ro
      - /sys:/sys:ro
      - /proc:/host/proc:ro
      - /mnt/backup:/mnt/backup:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - API_KEY=${API_KEY:-your-secret-key}
    command: uvicorn main:app --reload --host 0.0.0.0 --port 8000
    restart: always
    networks:
      - proxy

  client:
    build:
      context: ./client
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    container_name: nuc-monitor-client
    ports:
      - "3001:3000"
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    environment:
      - BACKEND_API_URL=http://nuc-monitor-server:8000
      - NODE_ENV=development
      - ALLOWED_DEV_ORIGINS=${ALLOWED_DEV_ORIGINS:-dev.beskarfox.com,stats.staging.beskarfox.com,localhost,127.0.0.1}
    command: npm run dev
    depends_on:
      - server
    restart: always
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.nuc-monitor-client.rule=Host(`${TRAEFIK_CLIENT_HOST:-dev.beskarfox.com}`)"
      - "traefik.http.routers.nuc-monitor-client.entrypoints=websecure"
      - "traefik.http.routers.nuc-monitor-client.tls=true"
      - "traefik.http.routers.nuc-monitor-client-web.rule=Host(`${TRAEFIK_CLIENT_HOST:-dev.beskarfox.com}`)"
      - "traefik.http.routers.nuc-monitor-client-web.entrypoints=web"
      - "traefik.http.services.nuc-monitor-client.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true
